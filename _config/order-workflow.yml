---
Name: silvershop-order-workflow
After:
  - '#silvershop'
---
SilverShop\Model\Order:
  extensions:
    - SilverShop\OrderWorkflow\Extension\OrderWorkflowExtension

SilverShop\OrderWorkflow\Workflow\OrderWorkflowService:
  # Advisory by default: observe + log every transition, never block.
  # Set strict: true to enforce the graph below (illegal transitions are vetoed
  # before the write). Strict mode intentionally constrains the free CMS status
  # dropdown and the core migration tasks, so it is opt-in.
  strict: false
  # Module's own OrderTransitionLog. Only written while core is NOT auditing transitions itself
  # (silvershop/core 6.3+ records them in OrderTransition by default), so nothing is logged twice.
  log_transitions: true
  # name => { from: <place|[places]>, to: <place>, permission?: <code> }. Places are the Order.Status
  # enum values, resolved at runtime. Names align with core's setStatus() intents where they overlap
  # (placed_unpaid / placed_paid / payment_received / member_cancel). An optional `permission` code gates
  # the transition: it is hidden from permittedTransitions() for members without it, and (in strict mode)
  # the veto blocks it. Ungated by default; e.g. add `permission: 'SHOP_CANCEL_ORDERS'` to admin_cancel.
  transitions:
    placed_unpaid:
      from: 'Cart'
      to: 'Unpaid'
    placed_paid:
      from: 'Cart'
      to: 'Paid'
    payment_received:
      from: 'Unpaid'
      to: 'Paid'
    process:
      from: 'Paid'
      to: 'Processing'
    send:
      from: ['Paid', 'Processing']
      to: 'Sent'
    complete:
      from: 'Sent'
      to: 'Complete'
    admin_cancel:
      from: ['Unpaid', 'Paid', 'Processing']
      to: 'AdminCancelled'
    member_cancel:
      from: ['Cart', 'Unpaid', 'Paid']
      to: 'MemberCancelled'

SilverShop\OrderWorkflow\Service\ScheduledTransitionService:
  # Max orders advanced per rule per sweep (bounds one job run).
  batch_size: 100
  # Time-based transitions. OFF until you add rules. Each: from/to (Order.Status places), `after`
  # (a strtotime duration measured from when the order entered `from`) and an optional `transition`
  # name (defaults to the rule key). Fired through Order::setStatus(), so the log + notifications +
  # ledger all run. Keep (from -> to) a real edge above so strict mode permits it.
  # scheduled_transitions:
  #   cancel_unpaid:
  #     from: 'Unpaid'
  #     to: 'AdminCancelled'
  #     transition: 'admin_cancel'
  #     after: '+14 days'
  #   auto_complete:
  #     from: 'Sent'
  #     to: 'Complete'
  #     transition: 'complete'
  #     after: '+7 days'

SilverShop\OrderWorkflow\Job\ScheduledTransitionsJob:
  # Minutes between recurring sweeps.
  scan_interval_mins: 60
